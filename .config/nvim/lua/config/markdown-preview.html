<style>
/* Catppuccin Latte (light) and Mocha (dark) via CSS variables.
   The theme is set on <html data-theme="..."> by the script below:
   stored user choice first, else the system preference. */
:root {
  color-scheme: light;
  --text: #4c4f69;
  --bg: #eff1f5;
  --h1-border: #ccd0da;
  --h2-border: #dce0e8;
  --link: #1e66f5;
  --link-visited: #7287fd;
  --link-hover: #209fb5;
  --code-bg: #e6e9ef;
  --pre-bg: #1e1e2e;
  --pre-text: #cdd6f4;
  --wikilink: #1e66f5;
  --quote-text: #6c6f85;
  --table-border: #ccd0da;
  --th-bg: #e6e9ef;
  --diagram-border: #ccd0da;
  --diagram-bg: #ffffff;
  --btn-bg: #eff1f5;
  --btn-hover: #dce0e8;
  --tag: #df8e1d;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --text: #cdd6f4;
  --bg: #1e1e2e;
  --h1-border: #45475a;
  --h2-border: #313244;
  --link: #89b4fa;
  --link-visited: #b4befe;
  --link-hover: #89dceb;
  --code-bg: #313244;
  --pre-bg: #11111b;
  --pre-text: #cdd6f4;
  --wikilink: #89b4fa;
  --quote-text: #a6adc8;
  --table-border: #45475a;
  --th-bg: #313244;
  --diagram-border: #45475a;
  --diagram-bg: #181825;
  --btn-bg: #313244;
  --btn-hover: #45475a;
  --tag: #f9e2af;
}

html { background: var(--bg); }

body {
  font-family: "Source Code Pro", "Fira Code", "JetBrains Mono", monospace;
  max-width: 960px;
  margin: 2rem auto;
  padding: 0 2rem;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
}

h1, h2, h3, h4 { color: var(--text); }
h1 { border-bottom: 1px solid var(--h1-border); padding-bottom: 0.4em; }
h2 { border-bottom: 1px solid var(--h2-border); padding-bottom: 0.3em; }

a { color: var(--link); }
a:visited { color: var(--link-visited); }
a:hover { color: var(--link-hover); }

code {
  background: var(--code-bg);
  padding: 0.15em 0.4em;
  border-radius: 4px;
  font-size: 0.9em;
}

pre {
  background: var(--pre-bg) !important;
  color: var(--pre-text);
  padding: 1em;
  border-radius: 6px;
  overflow-x: auto;
}
pre code { background: none; padding: 0; color: var(--pre-text); }

/* Pandoc syntax highlighting — Catppuccin Mocha */
pre code span.kw { color: #cba6f7; font-weight: bold; }
pre code span.cf { color: #cba6f7; font-weight: bold; }
pre code span.dt { color: #f9e2af; }
pre code span.dv { color: #fab387; }
pre code span.bn { color: #fab387; }
pre code span.fl { color: #fab387; }
pre code span.cn { color: #fab387; }
pre code span.ch { color: #a6e3a1; }
pre code span.st { color: #a6e3a1; }
pre code span.vs { color: #a6e3a1; }
pre code span.ss { color: #a6e3a1; }
pre code span.sc { color: #f5c2e7; }
pre code span.co { color: #6c7086; font-style: italic; }
pre code span.do { color: #6c7086; font-style: italic; }
pre code span.an { color: #6c7086; font-weight: bold; }
pre code span.cv { color: #6c7086; font-weight: bold; }
pre code span.in { color: #6c7086; }
pre code span.fu { color: #89b4fa; }
pre code span.va { color: #cdd6f4; }
pre code span.op { color: #89dceb; }
pre code span.bu { color: #f38ba8; }
pre code span.im { color: #cba6f7; }
pre code span.pp { color: #f5c2e7; }
pre code span.at { color: #f9e2af; }
pre code span.ot { color: #94e2d5; }
pre code span.al { color: #f38ba8; font-weight: bold; }
pre code span.er { color: #f38ba8; font-weight: bold; }
pre code span.wa { color: #f9e2af; font-weight: bold; }
pre code span.ex { color: #89b4fa; }

.wikilink {
  background: color-mix(in srgb, var(--wikilink) 13%, transparent);
  color: var(--wikilink);
  padding: 0.1em 0.4em;
  border-radius: 3px;
  font-weight: 600;
}

.tag {
  color: var(--tag);
  font-weight: bold;
}

blockquote {
  border-left: 3px solid var(--link);
  margin-left: 0;
  padding-left: 1em;
  color: var(--quote-text);
}

table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid var(--table-border); padding: 0.5em 0.8em; }
th { background: var(--th-bg); }

.diagram-container {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--diagram-border);
  border-radius: 6px;
  background: var(--diagram-bg);
  margin: 1em 0;
  cursor: grab;
  min-height: 400px;
}
.diagram-container:active { cursor: grabbing; }
.diagram-container .diagram-inner {
  transform-origin: 0 0;
  padding: 1em;
}
.diagram-container .diagram-inner svg {
  width: 100%;
  height: auto;
}
.diagram-controls {
  position: absolute;
  top: 0.4em;
  right: 0.4em;
  display: flex;
  gap: 0.2em;
  z-index: 1;
}
.diagram-controls button {
  width: 1.8em;
  height: 1.8em;
  border: 1px solid var(--diagram-border);
  border-radius: 4px;
  background: var(--btn-bg);
  color: var(--text);
  font-size: 0.9em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.diagram-controls button:hover { background: var(--btn-hover); }

.theme-toggle {
  position: fixed;
  top: 0.75rem;
  right: 0.75rem;
  width: 2.2em;
  height: 2.2em;
  border: 1px solid var(--diagram-border);
  border-radius: 6px;
  background: var(--btn-bg);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.theme-toggle:hover { background: var(--btn-hover); }
</style>

<script>
// Pick the theme before the page paints: stored choice first, else system.
(function() {
  var theme = null;
  try { theme = localStorage.getItem("preview-theme"); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  function storedTheme() {
    try { return localStorage.getItem("preview-theme"); } catch (e) { return null; }
  }

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  // ── Theme toggle ───────────────────────────────────────────
  var toggle = document.createElement("button");
  toggle.className = "theme-toggle";
  document.body.appendChild(toggle);

  function updateToggleIcon() {
    toggle.textContent = currentTheme() === "dark" ? "\u2600\uFE0F" : "\uD83C\uDF19";
    toggle.title = currentTheme() === "dark" ? "Switch to light theme" : "Switch to dark theme";
  }

  toggle.addEventListener("click", function() {
    applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
  });

  // Follow live system theme changes while the user has no stored choice
  var media = window.matchMedia("(prefers-color-scheme: dark)");
  media.addEventListener("change", function(e) {
    if (!storedTheme()) applyTheme(e.matches ? "dark" : "light", false);
  });

  // ── Mermaid ────────────────────────────────────────────────
  // Convert pandoc mermaid code blocks into mermaid divs,
  // keeping the source so diagrams can be re-rendered on theme change.
  document.querySelectorAll('pre.mermaid').forEach(function(pre) {
    var code = pre.querySelector('code');
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code ? code.textContent : pre.textContent;
    div.dataset.src = div.textContent;
    pre.replaceWith(div);
  });

  function renderMermaid(theme) {
    mermaid.initialize({ startOnLoad: false, theme: theme });
    document.querySelectorAll('.mermaid').forEach(function(el) {
      el.removeAttribute('data-processed');
      el.textContent = el.dataset.src;
    });
    mermaid.run();
  }

  function applyTheme(theme, save) {
    if (theme === currentTheme() && rendered) return;
    document.documentElement.setAttribute("data-theme", theme);
    if (save) {
      try { localStorage.setItem("preview-theme", theme); } catch (e) {}
    }
    updateToggleIcon();
    renderMermaid(theme);
    rendered = true;
  }

  var rendered = false;
  applyTheme(currentTheme(), false);

  // After mermaid renders, wrap each diagram in a zoom/pan container
  setTimeout(function() {
    document.querySelectorAll('.mermaid').forEach(function(el) {
      var container = document.createElement('div');
      container.className = 'diagram-container';
      var inner = document.createElement('div');
      inner.className = 'diagram-inner';
      el.parentNode.insertBefore(container, el);
      inner.appendChild(el);
      container.appendChild(inner);

      var controls = document.createElement('div');
      controls.className = 'diagram-controls';
      controls.innerHTML = '<button data-action="in" title="Zoom in">+</button>'
        + '<button data-action="out" title="Zoom out">&minus;</button>'
        + '<button data-action="reset" title="Reset">&#8634;</button>';
      container.appendChild(controls);

      var scale = 1, tx = 0, ty = 0;
      function apply() {
        inner.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      }

      controls.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var action = btn.dataset.action;
        if (action === 'in') scale = Math.min(scale * 1.25, 5);
        else if (action === 'out') scale = Math.max(scale / 1.25, 0.2);
        else { scale = 1; tx = 0; ty = 0; }
        apply();
      });

      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        if (e.deltaY < 0) scale = Math.min(scale * 1.1, 5);
        else scale = Math.max(scale / 1.1, 0.2);
        apply();
      }, { passive: false });

      var dragging = false, startX, startY;
      container.addEventListener('mousedown', function(e) {
        if (e.target.closest('.diagram-controls')) return;
        dragging = true; startX = e.clientX - tx; startY = e.clientY - ty;
      });
      window.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        tx = e.clientX - startX; ty = e.clientY - startY;
        apply();
      });
      window.addEventListener('mouseup', function() { dragging = false; });
    });
  }, 500);

  // ── Tag badges (#forum, #bug, ...) ─────────────────────────
  document.querySelectorAll("p, li, td, th").forEach(function(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        var p = node.parentNode;
        while (p && p !== el) {
          if (p.tagName === 'PRE' || p.tagName === 'CODE') return NodeFilter.FILTER_REJECT;
          p = p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    textNodes.forEach(function(tn) {
      if (!/(#[A-Za-z0-9_-]+)/.test(tn.textContent)) return;
      var wrapper = document.createElement('span');
      wrapper.innerHTML = tn.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/(#[A-Za-z0-9_-]+)/g, function(match) {
          return '<span class="tag">' + match + '</span>';
        });
      tn.parentNode.replaceChild(wrapper, tn);
    });
  });
});
</script>
